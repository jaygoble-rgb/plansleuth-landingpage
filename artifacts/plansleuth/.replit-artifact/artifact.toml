kind = "web"
previewPath = "/"
title = "PlanSleuth - Coming Soon"
version = "1.0.0"
id = "artifacts/plansleuth"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 25293

[services.development]
run = "pnpm --filter @workspace/plansleuth run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/plansleuth", "run", "build" ]
publicDir = "artifacts/plansleuth/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "25293"
BASE_PATH = "/"
