kind = "web"
previewPath = "/"
title = "PlanAlert"
version = "1.0.0"
id = "artifacts/planalert"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 18839

[services.development]
run = "pnpm --filter @workspace/planalert run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/planalert", "run", "build" ]
run = "node artifacts/planalert/server/index.mjs"

[services.env]
PORT = "18839"
BASE_PATH = "/"
