kind = "web"
previewPath = "/"
title = "PlanAlert"
version = "1.0.0"
id = "artifacts/planalert"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 18839

[services.development]
run = "pnpm --filter @workspace/planalert run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/planalert", "run", "build" ]
publicDir = "artifacts/planalert/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "18839"
BASE_PATH = "/"

[[services.production.responseHeaders]]
path = "/assets/*"
name = "Cache-Control"
value = "public, max-age=31536000, immutable"

[[services.production.responseHeaders]]
path = "/*"
name = "Cache-Control"
value = "no-cache"
