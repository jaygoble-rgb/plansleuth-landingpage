<svg viewBox="0 0 340 390" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="highlightGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="hsla(38,92%,50%,0)" />
      <stop offset="50%" stop-color="hsla(38,92%,50%,0.35)" />
      <stop offset="100%" stop-color="hsla(38,92%,50%,0)" />
    </linearGradient>
  </defs>

  <!-- Bill stack — back sheets for depth -->
  <rect x="74" y="98" width="200" height="244" rx="10" fill="#e8e4dc" stroke="#ccc8c0" stroke-width="1" transform="rotate(4 174 220)" />
  <rect x="62" y="84" width="200" height="244" rx="10" fill="#f0ede7" stroke="#d4d0c8" stroke-width="1.2" transform="rotate(-2 162 206)" />

  <!-- Front bill -->
  <rect x="58" y="72" width="200" height="244" rx="10" fill="white" stroke="#c8c4bc" stroke-width="1.5" />

  <!-- Bill header bar -->
  <rect x="58" y="72" width="200" height="40" rx="10" fill="hsl(215,65%,11%)" />
  <rect x="58" y="92" width="200" height="20" fill="hsl(215,65%,11%)" />

  <!-- Header text -->
  <text x="72" y="89" font-family="sans-serif" font-size="9" font-weight="700" letter-spacing="1.5" fill="rgba(255,255,255,0.9)">WIRELESS BILL</text>
  <text x="72" y="102" font-family="sans-serif" font-size="7" fill="rgba(255,255,255,0.5)">April 2026</text>
  <text x="248" y="89" font-family="sans-serif" font-size="7" fill="rgba(255,255,255,0.45)" text-anchor="end">Acct #8847</text>

  <!-- Account / amount due -->
  <text x="72" y="130" font-family="sans-serif" font-size="8" fill="#a8a49c">J. Smith — Unlimited Plus</text>
  <text x="72" y="146" font-family="sans-serif" font-size="8" fill="#b0aba2">Amount Due</text>
  <text x="72" y="164" font-family="sans-serif" font-size="16" font-weight="700" fill="#6b665e">$89.99</text>

  <!-- Divider -->
  <line x1="72" y1="180" x2="244" y2="180" stroke="#ece8e2" stroke-width="1" />

  <!-- Line items -->
  <text x="72" y="196" font-family="sans-serif" font-size="8.5" fill="#8c887f">Base Plan</text>
  <text x="244" y="196" font-family="sans-serif" font-size="8.5" fill="#8c887f" text-anchor="end">$45.00</text>

  <text x="72" y="212" font-family="sans-serif" font-size="8.5" fill="#8c887f">Unlimited Data</text>
  <text x="244" y="212" font-family="sans-serif" font-size="8.5" fill="#8c887f" text-anchor="end">$25.00</text>

  <text x="72" y="228" font-family="sans-serif" font-size="8.5" fill="#8c887f">Device Payment</text>
  <text x="244" y="228" font-family="sans-serif" font-size="8.5" fill="#8c887f" text-anchor="end">$12.50</text>

  <text x="72" y="244" font-family="sans-serif" font-size="8.5" fill="#8c887f">Taxes &amp; Fees</text>
  <text x="244" y="244" font-family="sans-serif" font-size="8.5" fill="#8c887f" text-anchor="end">$7.49</text>

  <!-- Divider -->
  <line x1="72" y1="260" x2="244" y2="260" stroke="#d8d4cc" stroke-width="1" />

  <!-- Total highlighted -->
  <rect x="64" y="268" width="188" height="22" rx="4" fill="url(#highlightGrad)" opacity="0.7" />
  <text x="72" y="284" font-family="sans-serif" font-size="9" font-weight="700" fill="#6b665e">Total Due</text>
  <text x="244" y="284" font-family="sans-serif" font-size="11" font-weight="700" fill="#6b665e" text-anchor="end">$89.99</text>
</svg>
