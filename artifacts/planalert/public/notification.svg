<svg viewBox="0 0 256 84" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="rgba(0,0,0,0.10)" />
    </filter>
  </defs>

  <!-- Card background -->
  <rect x="1" y="1" width="254" height="82" rx="12" fill="white" stroke="rgba(15,35,68,0.10)" stroke-width="1" filter="url(#shadow)" />

  <!-- Bell icon circle -->
  <circle cx="30" cy="42" r="18" fill="hsla(38,92%,50%,0.15)" />

  <!-- Bell icon (simplified) -->
  <g transform="translate(30,42)">
    <!-- Bell body -->
    <path d="M-5,-7 Q-5,-12 0,-12 Q5,-12 5,-7 L6,2 Q6,5 3,5 L-3,5 Q-6,5 -6,2 Z" fill="hsl(38,92%,50%)" />
    <!-- Bell clapper -->
    <rect x="-1.5" y="5" width="3" height="2.5" rx="1.5" fill="hsl(38,92%,50%)" />
    <!-- Bell top stem -->
    <rect x="-1" y="-14" width="2" height="3" rx="1" fill="hsl(38,92%,50%)" />
  </g>

  <!-- Notification dot -->
  <circle cx="44" cy="26" r="5" fill="white" />
  <circle cx="44" cy="26" r="4" fill="hsl(38,92%,50%)" />

  <!-- "PlanAlert" label -->
  <text x="57" y="33" font-family="sans-serif" font-size="9" font-weight="700" letter-spacing="1" fill="hsl(38,92%,50%)" text-transform="uppercase">✦ PLANALERT</text>

  <!-- "Better deal found" heading -->
  <text x="57" y="48" font-family="sans-serif" font-size="13" font-weight="700" fill="hsl(215,65%,11%)">Better deal found</text>

  <!-- Sub-text -->
  <text x="57" y="63" font-family="sans-serif" font-size="11" fill="hsl(215,16%,47%)">Same plan, </text>
  <text x="117" y="63" font-family="sans-serif" font-size="11" font-weight="700" fill="hsl(215,65%,11%)">$30/mo less</text>
  <text x="179" y="63" font-family="sans-serif" font-size="11" fill="hsl(215,16%,47%)">. Tap to review.</text>
</svg>
